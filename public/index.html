<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#eceae4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15171c" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="{{PRODUCT}}">
<title>{{PRODUCT}}</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100,400;100,500;100,600;112,700;112,800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Tokens. Channels: story (blue), voice (rust), rules (violet), output (green); amber is the master/action color. */
:root {
  --bg: #eceae4; --panel: #f8f7f3; --panel-2: #e2e0d8; --line: #cfcbc1; --well: #ffffff;
  --fg: #1b1d22; --muted: #5c616b; --faint: #8a8f98;
  --master: #b56d0c; --on-master: #1b1408; --story: #2a73b3; --voice: #bf5536; --rules: #7a5bb5; --out: #3d8a45;
  --danger: #b3261e; --warn: #9a6a00; --ok: #2f7a3a;
  --f-display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --f-body: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --r: 12px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #15171c; --panel: #1e2128; --panel-2: #282c35; --line: #363b46; --well: #101216;
  --fg: #ebe8e1; --muted: #9ba1ac; --faint: #737985;
  --master: #f0a640; --story: #64aee8; --voice: #e88a6d; --rules: #ac90de; --out: #82c886;
  --danger: #f2867d; --warn: #f0c35a; --ok: #82c886; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #15171c; --panel: #1e2128; --panel-2: #282c35; --line: #363b46; --well: #101216;
  --fg: #ebe8e1; --muted: #9ba1ac; --faint: #737985;
  --master: #f0a640; --story: #64aee8; --voice: #e88a6d; --rules: #ac90de; --out: #82c886;
  --danger: #f2867d; --warn: #f0c35a; --ok: #82c886; color-scheme: dark; }
/* Comfortable text (v15): one switch (Account → Comfort) for bigger type and stronger contrast on this
   device; the phone's "increase contrast" setting brings the stronger contrast by itself. */
:root[data-comfort="on"] body { zoom: 1.15; }
:root[data-comfort="on"] { --muted: #3a3e45; --faint: #555a63; --line: #a39e91; }
@media (prefers-contrast: more) { :root { --muted: #3a3e45; --faint: #555a63; --line: #a39e91; } }
@media (prefers-color-scheme: dark) { :root[data-comfort="on"]:not([data-theme="light"]) { --fg: #f6f4ef; --muted: #c9ced6; --faint: #a3a9b4; --line: #5a6070; } }
@media (prefers-color-scheme: dark) and (prefers-contrast: more) { :root:not([data-theme="light"]) { --fg: #f6f4ef; --muted: #c9ced6; --faint: #a3a9b4; --line: #5a6070; } }
:root[data-comfort="on"][data-theme="dark"] { --fg: #f6f4ef; --muted: #c9ced6; --faint: #a3a9b4; --line: #5a6070; }
@media (prefers-contrast: more) { :root[data-theme="dark"] { --fg: #f6f4ef; --muted: #c9ced6; --faint: #a3a9b4; --line: #5a6070; } }
/* The privacy curtain (v15): client names, numbers and notes blurred with one tap (the eye in the header). */
:root[data-curtain="on"] .pii { filter: blur(6px); user-select: none; }
.curtain-btn { background: transparent; border: 1px solid var(--line); border-radius: 999px; width: 36px; height: 36px; display: inline-grid; place-items: center; color: var(--muted); flex: none; }
.curtain-btn[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }

* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--fg); margin: 0; }
body { font-family: var(--f-body); font-stretch: 100%; font-size: 15px; line-height: 1.45; -webkit-text-size-adjust: 100%; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--master); outline-offset: 2px; }
[hidden] { display: none !important; }
a { color: inherit; }

/* Shell */
.top { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--line);
  padding: calc(10px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); }
.top-row { max-width: 1100px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 40px; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand img { width: 28px; height: 28px; border-radius: 7px; flex: none; }
.brand b { font-family: var(--f-display); font-stretch: 112%; font-weight: 800; font-size: 18px; letter-spacing: -.01em; white-space: nowrap; }
.brand span { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.nav { max-width: 1100px; margin: 8px auto 0; display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
/* v15 Phase 10: the initial's menu (Account, Guide, Billing), Setup's path, Grow's tabs, Today's stops */
.top-row .curtain-btn { margin-left: auto; }
.me-menu { position: relative; flex: none; }
.me-btn { width: 36px; height: 36px; border-radius: 999px; border: 0; background: var(--fg); color: var(--bg); font-weight: 800; font-size: 15px; cursor: pointer; }
.me-btn[aria-current="page"] { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--master); }
.me-pop { position: absolute; right: 0; top: 44px; z-index: 60; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,.2); padding: 6px; min-width: 190px; display: grid; gap: 2px; }
.me-pop a, .me-pop button { text-decoration: none; text-align: left; padding: 10px 12px; border-radius: 8px; font: inherit; font-weight: 600; background: none; border: 0; color: var(--fg); cursor: pointer; }
.me-pop a:hover, .me-pop button:hover, .me-pop a[aria-current="page"] { background: color-mix(in srgb, var(--fg) 7%, transparent); }
.me-pop .small { margin: 0; padding: 6px 12px 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.me-pop .danger { color: var(--danger, #b3261e); }
.steps, .subnav { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.steps::-webkit-scrollbar, .subnav::-webkit-scrollbar { display: none; }
.steps a, .subnav a { flex: none; text-decoration: none; display: flex; align-items: center; gap: 6px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 999px; font-size: 14px; font-weight: 600; color: var(--muted); background: var(--panel); }
.steps a b { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 999px; background: color-mix(in srgb, var(--fg) 10%, transparent); font-size: 12px; }
.steps a[aria-current="step"], .subnav a[aria-current="page"] { color: var(--fg); border-color: var(--master); }
.steps a[aria-current="step"] b { background: var(--master); color: #1b1408; }
.step-next, .chain-next { justify-content: flex-end; }
.stops { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
.stop { text-decoration: none; display: grid; gap: 2px; padding: 14px; border: 1px solid var(--line); border-radius: 14px; background: var(--panel); }
.stop b { font-size: 28px; line-height: 1.1; font-family: var(--f-display); font-stretch: 112%; }
.stop span { font-weight: 600; font-size: 14px; }
.stop small { color: var(--muted); }
.stop.quiet b { color: var(--muted); }
.box.today-item { display: flex; align-items: center; gap: 10px; text-decoration: none; }
.nav::-webkit-scrollbar { display: none; }
.nav a { text-decoration: none; padding: 9px 12px 11px; font-weight: 600; font-size: 14px; color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap; display: flex; align-items: center; gap: 6px; }
.nav a[aria-current="page"] { color: var(--fg); border-bottom-color: var(--master); }
/* (v15 Phase 10) Six stops fit across a phone */
@media (max-width: 440px) { .nav { gap: 0; } .nav a { padding: 9px 5px 11px; font-size: 13px; gap: 4px; } .nav a .badge { min-width: 17px; height: 17px; padding: 0 4px; font-size: 10.5px; } }
.badge { font-family: var(--f-mono); font-size: 11px; font-weight: 500; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px; background: var(--master); color: var(--on-master); display: inline-grid; place-items: center; }
main { max-width: 1100px; margin: 0 auto; padding: 20px max(16px, env(safe-area-inset-right, 0px)) calc(110px + env(safe-area-inset-bottom, 0px) + var(--kb, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: grid; gap: 18px; }
.acting { max-width: 1100px; margin: 10px auto 0; display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; font-size: 13px; background: var(--panel); border: 1px dashed var(--master); border-radius: 10px; padding: 8px 12px; }

/* Type */
h1 { font-family: var(--f-display); font-stretch: 112%; font-weight: 800; font-size: clamp(24px, 5.5vw, 32px); line-height: 1.05; margin: 0; letter-spacing: -.01em; }
h2 { font-family: var(--f-display); font-stretch: 112%; font-weight: 800; font-size: 19px; margin: 0; display: flex; align-items: center; gap: 10px; }
h3 { font-family: var(--f-display); font-stretch: 112%; font-weight: 700; font-size: 15px; margin: 0; }
.lede { color: var(--muted); margin: 6px 0 0; max-width: 62ch; }
.label { font-family: var(--f-mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); } .small { font-size: 13px; } .mono { font-family: var(--f-mono); }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--c, var(--master)); flex: none; }

/* Panels */
.panel { --c: var(--master); background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: grid; gap: 16px; min-width: 0; grid-template-columns: minmax(0, 1fr); }
.panel > * { min-width: 0; }
.panel.story { --c: var(--story); } .panel.voice { --c: var(--voice); } .panel.rules { --c: var(--rules); } .panel.out { --c: var(--out); }
.head { display: grid; gap: 4px; }
.head p { margin: 0; color: var(--muted); font-size: 13.5px; max-width: 64ch; }
.grid2 { display: grid; gap: 18px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 900px) { .grid2 { grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); align-items: start; } }
.stack { display: grid; gap: 10px; min-width: 0; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.row.between { justify-content: space-between; }
.divider { height: 1px; background: var(--line); }

/* Controls */
.ctl { background: var(--well); border: 1px solid var(--line); border-radius: 9px; padding: 9px 12px; min-height: 42px; width: 100%; min-width: 0; }
.ctl.sm { min-height: 36px; padding: 6px 10px; font-size: 14px; }
textarea.ctl { resize: vertical; min-height: 70px; line-height: 1.45; }
select.ctl { appearance: auto; }
.field { display: grid; gap: 6px; min-width: 0; }
.field > span:first-child { font-weight: 600; font-size: 14px; }
.field small { color: var(--muted); font-size: 12.5px; }
.fields { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); }
.btn { background: var(--panel-2); border: 1px solid var(--line); border-radius: 9px; padding: 9px 14px; min-height: 42px; font-weight: 600; font-size: 14.5px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; text-align: center; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--master); border-color: var(--master); color: var(--on-master); }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--danger); }
.btn.sm { min-height: 34px; padding: 5px 11px; font-size: 13.5px; }
.btn.big { min-height: 52px; font-size: 16px; padding: 12px 20px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; cursor: pointer; }
.check input { width: 20px; height: 20px; flex: none; margin: 1px 0 0; accent-color: var(--c, var(--master)); }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 4px; background: var(--well); border: 1px solid var(--line); border-radius: 10px; padding: 4px; }
.seg button { border: 0; border-radius: 7px; padding: 8px 6px; background: transparent; font-weight: 600; font-size: 13.5px; color: var(--muted); line-height: 1.2; min-width: 0; }
.seg button[aria-pressed="true"] { background: var(--c, var(--master)); color: var(--well); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 4px; max-width: 100%; background: var(--well); border: 1px solid var(--line); border-radius: 999px; padding: 4px 4px 4px 12px; font-size: 13.5px; }
.chip span { overflow-wrap: anywhere; }
.chip.locked { padding-right: 12px; border-style: dashed; }
.toggle { font-size: 13px; border-radius: 999px; padding: 6px 12px; border: 1px solid var(--line); background: transparent; color: var(--muted); max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.toggle[aria-pressed="true"] { background: var(--c, var(--master)); border-color: var(--c, var(--master)); color: var(--well); }
.x { border: 0; background: transparent; color: var(--muted); width: 28px; height: 28px; border-radius: 50%; font-size: 17px; line-height: 1; flex: none; }
.x:hover { background: var(--panel-2); color: var(--fg); }

/* Status */
.pill { font-family: var(--f-mono); font-size: 11px; letter-spacing: .05em; text-transform: uppercase; padding: 3px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.pill.ok { border-color: var(--ok); color: var(--ok); } .pill.warn { border-color: var(--warn); color: var(--warn); } .pill.err { border-color: var(--danger); color: var(--danger); } .pill.ai { border-color: var(--rules); color: var(--rules); }
.note { font-size: 13.5px; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--well); }
.note.warn { border-color: var(--warn); } .note.err { border-color: var(--danger); } .note.ok { border-color: var(--ok); }
.note b { font-weight: 600; }
.empty { color: var(--muted); font-size: 14px; font-style: italic; }
.status { font-size: 13px; color: var(--muted); min-height: 1.3em; overflow-wrap: anywhere; }
.status.err { color: var(--danger); } .status.ok { color: var(--ok); }
.list { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; }
.list li { display: flex; gap: 8px; align-items: flex-start; font-size: 13.5px; }
.list li i { font-style: normal; font-family: var(--f-mono); font-size: 12px; width: 18px; flex: none; text-align: center; }
.list li.ok i { color: var(--ok); } .list li.bad i { color: var(--warn); }
.log { margin: 0; font-family: var(--f-mono); font-size: 11.5px; line-height: 1.5; color: var(--muted); white-space: pre-wrap; overflow-wrap: anywhere; max-height: 200px; overflow: auto; background: var(--well); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
details > summary { cursor: pointer; font-size: 13.5px; color: var(--muted); font-weight: 500; }
details[open] > summary { margin-bottom: 10px; }

/* Meters */
.meter { height: 10px; border-radius: 6px; background: var(--panel-2); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--master); border-radius: 6px; }
.stats { display: grid; gap: 14px 22px; grid-template-columns: repeat(auto-fill, minmax(128px, 1fr)); }
.nums { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
.stat { display: grid; }
.stat b { font-family: var(--f-display); font-stretch: 112%; font-size: 24px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.1; }
.stat span { font-size: 12.5px; color: var(--muted); }

/* Videos */
.vids { display: grid; gap: 14px; }
.vid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; background: var(--well); border: 1px solid var(--line); border-radius: 14px; padding: 12px; }
@media (min-width: 640px) { .vid { grid-template-columns: 210px minmax(0, 1fr); } }
.player { width: 100%; max-width: 260px; aspect-ratio: 9 / 16; border-radius: 10px; background: #000; object-fit: cover; justify-self: center; display: block; }
.vid .info { display: grid; gap: 12px; align-content: start; min-width: 0; }
.meta { margin: 0; display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 4px 10px; font-size: 13.5px; }
.meta dt { font-family: var(--f-mono); font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); padding-top: 3px; }
.meta dd { margin: 0; overflow-wrap: anywhere; }
.script { margin: 0; padding-left: 22px; display: grid; gap: 4px; font-size: 14px; }
.script small { color: var(--muted); }
.post { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 9px; padding: 10px 12px; margin: 0; }
.box { display: grid; gap: 10px; border: 1px solid var(--line); border-radius: 12px; padding: 12px; background: var(--panel); }
.box.approve { border-color: var(--ok); }
.compact { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 12px; align-items: start; background: var(--well); border: 1px solid var(--line); border-radius: 12px; padding: 10px; }
.compact.nocover { grid-template-columns: minmax(0, 1fr); }
.compact img { width: 64px; aspect-ratio: 9 / 16; object-fit: cover; border-radius: 6px; background: #000; }
.scene-edit { display: grid; gap: 8px; border: 1px solid var(--line); border-radius: 10px; padding: 10px; background: var(--panel); }

/* Tables */
.table-wrap { overflow-x: auto; }
table.t { width: 100%; border-collapse: collapse; font-size: 13.5px; font-variant-numeric: tabular-nums; }
table.t th, table.t td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.t th { font-family: var(--f-mono); font-weight: 500; font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }

/* Content editor */
.item { --c: var(--story); background: var(--well); border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: grid; gap: 10px; }
.item.unrouted { border-style: dashed; }
.item-top { display: flex; gap: 8px; align-items: flex-start; }
.item-top > :first-child { flex: 1; min-width: 0; }
.links { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.item details > summary { font-size: 13px; }
.add { display: flex; gap: 8px; }
.add input { flex: 1; }
.fact.confirmed { border-color: var(--ok); }
.fact.stale { border-color: var(--warn); }
.problems { margin: 0; padding-left: 18px; font-size: 13px; color: var(--danger); }
/* v15 Studio findings: what holds the render (red), notes (amber) and what's fixed for you (quiet). */
.problems.findings { list-style: none; padding-left: 0; display: grid; gap: 6px; color: inherit; }
.findings li, .list li.note-warn, .list li.fixed { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; }
.findings li i { font-style: normal; font-family: var(--f-mono); font-size: 12px; width: 18px; flex: none; text-align: center; }
.findings li.bad, .list li.bad span { color: var(--danger); } .findings li.bad i { color: var(--danger); }
.findings li.note-warn, .list li.note-warn { color: var(--warn); } .list li.note-warn i { color: var(--warn); }
.findings li.fixed, .list li.fixed { color: var(--muted); }
.findings .btn, .list li .btn { margin-left: 4px; vertical-align: baseline; }
.linkish { background: none; border: 0; padding: 0; font: inherit; color: inherit; text-decoration: underline; text-underline-offset: 2px; cursor: pointer; }
.btn.xs { padding: 3px 10px; font-size: 12.5px; min-height: 30px; }
.scene-edit.flash { outline: 2px solid var(--accent, #c9a96e); outline-offset: 3px; border-radius: 10px; }
.warn-text { color: var(--warn); }
.toggle.off { text-decoration: line-through; opacity: .6; }
.spec { border-left: 3px solid var(--c); padding: 2px 0 2px 12px; display: grid; gap: 4px; font-size: 13.5px; }
.spec q { font-style: italic; }
.preview { margin: 0; background: var(--well); border: 1px solid var(--line); border-radius: 10px; padding: 14px; font-family: var(--f-mono); font-size: 12px; line-height: 1.6; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 60vh; overflow: auto; }
.preview mark { background: transparent; color: var(--master); border-bottom: 1px dotted var(--master); }

/* Save bar */
.savebar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--panel); border-top: 1px solid var(--line); padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.savebar > div { max-width: 1100px; margin: 0 auto; display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }

/* Setup wizard */

.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
